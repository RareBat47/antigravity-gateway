[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-gateway"
version = "1.0.0"
description = "Antigravity Multi-Account Gateway for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RareBat47" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.8.0",
    "click>=8.1.7",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
agw = "agw.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
