server:
  host: "127.0.0.1"
  port: 8999
  debug: false
  public_base_url: ""

security:
  gateway_api_key: "test-gateway-key"
  admin_api_key: "test-admin-key"
  handy_api_key: "agw-handy-primary"
  local_trust: false
  dashboard_local_access: true
  encryption_key: ""
  rate_limit_per_minute: 120
  cors_origins: []
  api_keys:
    # =========================================================================
    # THE 10 STANDARDIZED API KEYS MATRIX (5 GROUPS × 2 KEYS: PRIMARY + SECONDARY)
    # Use these keys across multiple machines/IDEs with built-in failover.
    # =========================================================================

    # --- 1. AGY (Google Cloud Code OAuth: Claude 5 Series, Gemini 3 Series, GPT-OSS) ---
    - key: "agw-agy-primary"
      name: "agy (Primary)"
      description: "Google Cloud Code OAuth Engine - Primary Workstation Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "agy"
      advertise_all_models: true

    - key: "agw-agy-secondary"
      name: "agy (Secondary / Failover)"
      description: "Google Cloud Code OAuth Engine - Secondary / Remote Device Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "agy"
      advertise_all_models: true

    # --- 2. GWEB (Gemini Web Free Sessions: Gemini Advanced via Cookies) ---
    - key: "agw-gweb-primary"
      name: "gweb (Primary)"
      description: "Consumer Gemini Web Session Extractor - Primary Workstation Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "gweb"
      advertise_all_models: true

    - key: "agw-gweb-secondary"
      name: "gweb (Secondary / Failover)"
      description: "Consumer Gemini Web Session Extractor - Secondary / Remote Device Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "gweb"
      advertise_all_models: true

    # --- 3. STUDIO (Google AI Studio Free Tier: Vertex AI REST API) ---
    - key: "agw-studio-primary"
      name: "studio (Primary)"
      description: "Google AI Studio Developer API - Primary Workstation Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "studio"
      advertise_all_models: true

    - key: "agw-studio-secondary"
      name: "studio (Secondary / Failover)"
      description: "Google AI Studio Developer API - Secondary / Remote Device Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "studio"
      advertise_all_models: true

    # --- 4. GCLI (Gemini Cloud CLI Protocol: Code Assist Engine) ---
    - key: "agw-gcli-primary"
      name: "gcli (Primary)"
      description: "Gemini CLI OAuth Channel - Primary Workstation Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "gcli"
      advertise_all_models: true

    - key: "agw-gcli-secondary"
      name: "gcli (Secondary / Failover)"
      description: "Gemini CLI OAuth Channel - Secondary / Remote Device Key"
      allowed_families: ["all"]
      allowed_models: []
      profile: "gcli"
      advertise_all_models: true

    # --- 5. HANDY (Handy Creative Media Suite: Veo, Lyria, Genie, Flow, Playground) ---
    - key: "agw-handy-primary"
      name: "handy (Primary)"
      description: "Handy Creative Media Suite - Primary Workstation Key"
      allowed_families: ["handy", "all"]
      allowed_models: []
      profile: "handy"
      advertise_all_models: true

    - key: "agw-handy-secondary"
      name: "handy (Secondary / Failover)"
      description: "Handy Creative Media Suite - Secondary / Remote Device Key"
      allowed_families: ["handy", "all"]
      allowed_models: []
      profile: "handy"
      advertise_all_models: true

storage:
  database_path: "data/gateway.db"
  vault_key_path: "data/vault.key"
  quota_state_path: "data/quota-state.json"
  status_report_path: "docs/account-status.md"

scheduler:
  strategy: "hybrid"
  weights:
    health: 2.0
    tokens: 5.0
    quota: 3.0
    lru: 0.1
  global_quota_threshold: 0.05
  max_account_retries: 3
  default_cooldown_seconds: 60
  upstream_timeout_seconds: 300
  cooldown_tiers_seconds:
    - 60
    - 300
    - 1800
    - 7200

quota_monitor:
  enabled: true
  interval_seconds: 300
  stale_threshold_seconds: 600

models:
  # 1. Tiered Flash Backbone
  gemini-3.8-flash-high:
    upstream_id: "gemini-3.8-flash-tiered"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65536
  # 2. Agent & Pro Reasoning
  gemini-3.1-pro-low:
    upstream_id: "gemini-3.8-flash-tiered"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 8192
  gemini-pro-agent:
    upstream_id: "gemini-3.8-flash-tiered"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65535
  agentic-pro:
    upstream_id: "gemini-3.8-flash-tiered"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65535
  gemini-2.5-pro:
    upstream_id: "gemini-2.5-pro"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65536
  gemini-advanced:
    upstream_id: "gemini-2.5-pro"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65536
  # 3. Claude Flagships
  claude-sonnet-5.5:
    upstream_id: "claude-sonnet-4-6"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  claude-opus-5.5:
    upstream_id: "claude-opus-4-6-thinking"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  claude-sonnet-5[1m]:
    upstream_id: "claude-sonnet-4-6"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  claude-opus-5[1m]:
    upstream_id: "claude-opus-4-6-thinking"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  # 4. Open-Weights Benchmark
  gpt-oss-120b-medium:
    upstream_id: "gpt-oss-120b-medium"
    family: "gpt"
    capabilities: ["tools", "streaming"]
    max_output_tokens: 32768

