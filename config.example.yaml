server:
  host: "127.0.0.1"
  port: 8999
  debug: false
  public_base_url: ""

security:
  gateway_api_key: ""
  admin_api_key: ""
  local_trust: false
  dashboard_local_access: true
  encryption_key: ""
  rate_limit_per_minute: 120
  cors_origins: []
  api_keys:
    # Client profiles: each sees the complete active model catalog.
    - key: "agw-hermes-local"
      name: "Hermes Agent"
      description: "Hermes Agent complete model catalog"
      allowed_families: ["all"]
      allowed_models: []
      profile: "hermes"
      advertise_all_models: true
    - key: "agw-claude-code-local"
      name: "Claude Code"
      description: "Claude Code complete model catalog via Anthropic Messages API"
      allowed_families: ["all"]
      allowed_models: []
      profile: "claude-code"
      advertise_all_models: true
    - key: "agw-opencode-local"
      name: "OpenCode"
      description: "OpenCode complete model catalog"
      allowed_families: ["all"]
      allowed_models: []
      profile: "opencode"
      advertise_all_models: true

storage:
  database_path: "data/gateway.db"
  vault_key_path: "data/vault.key"
  quota_state_path: "data/quota-state.json"
  status_report_path: "docs/account-status.md"

scheduler:
  strategy: "hybrid"
  weights:
    health: 2.0
    tokens: 5.0
    quota: 3.0
    lru: 0.1
  global_quota_threshold: 0.05
  max_account_retries: 3
  default_cooldown_seconds: 60
  upstream_timeout_seconds: 300
  cooldown_tiers_seconds:
    - 60
    - 300
    - 1800
    - 7200

quota_monitor:
  enabled: true
  interval_seconds: 300
  stale_threshold_seconds: 600

models:
  # 1. Tiered Flash Backbone
  gemini-3.8-flash-high:
    upstream_id: "gemini-3.8-flash-tiered"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65536
  # 2. Gemini 3.6 (Antigravity Agent Default)
  gemini-3.6-flash-high:
    upstream_id: "gemini-3.6-flash-high"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65536
  gemini-3.6-flash-medium:
    upstream_id: "gemini-3.6-flash-medium"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65536
  # 3. Pro Reasoning
  gemini-3.1-pro-low:
    upstream_id: "gemini-3.1-pro-low"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 8192
  gemini-pro-agent:
    upstream_id: "gemini-pro-agent"
    family: "gemini"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 65535
  # 4. Claude 5.5 Generation (1M Context / 128k Output)
  claude-opus-5-5-medium:
    upstream_id: "claude-opus-5-5-medium"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  claude-sonnet-5-5-high:
    upstream_id: "claude-sonnet-5-5-high"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  claude-sonnet-5-5-medium:
    upstream_id: "claude-sonnet-5-5-medium"
    family: "claude"
    capabilities: ["tools", "streaming", "vision", "thinking"]
    max_output_tokens: 128000
  # 5. Claude 4.6 Generation
  # 6. GPT Fallback
  gpt-oss-120b-medium:
    upstream_id: "gpt-oss-120b-medium"
    family: "gpt"
    capabilities: ["tools", "streaming"]
    max_output_tokens: 16384

